# Shortname for the provider type of IONEX file to download.
# Valid choices are JPL, COD, or ESA (case-insensitive).
IONEX_PROVIDER: "JPL"

# The minimum coverage, defined as the percent of bursts in a bursts set, required to run DSWx_S1
#  Must be an integer in the closed interval [0, 100] or null (~).
#  Cannot be set together with DSWX_S1_MINIMUM_NUMBER_OF_BURSTS_REQUIRED.
DSWX_S1_COVERAGE_TARGET: ~
# The minimum coverage, defined as the number of bursts in a bursts set, required to run DSWx_S1
#  Must be a non-negative integer or null (~).
#  Cannot be set together with DSWX_S1_COVERAGE_TARGET.
DSWX_S1_MINIMUM_NUMBER_OF_BURSTS_REQUIRED: 4
# Force DSWx-S1 processing of pending burst sets after X minutes, rather than waiting for additional data
DSWX_S1_COLLECTION_GRACE_PERIOD_MINUTES: 210
MGRS_TILE_COLLECTION_DB_S3PATH: "s3://opera-ancillaries/mgrs_tiles/dswx_s1/MGRS_tile_collection_v0.3.sqlite"

# The minimum coverage, defined as the percent of bursts in a bursts set, required to run DISP_S1
#  Must be a number in the closed interval [0, 99].
DISP_S1_COVERAGE_TARGET: 99

# Force DISP-S1 processing of pending burst sets after X minutes, rather than waiting for additional data
# This can be over-ridden by argument into daac_data_subsriber.py
DEFAULT_DISP_S1_QUERY_GRACE_PERIOD_MINUTES: 210

# The k-multiple by which the CSLC granules are queried from CMR at a time for DISP-S1 processing.
# If k=4 and this multiple is 2 then the CSLC granules will be queried by 8 acquisition-cycles at a time, which would be
# 8 * 12  = 96 days. We can tune this number to minimize CMR queries without adding undue load on CMR.
DISP_S1_K_FETCH_MULTIPLE: 2

# Flag (never block) DISP-S1 k-cycle input windows whose consecutive sensing dates are separated by
# more than this many days. Such windows indicate a real acquisition gap for the frame; the KSC is
# still created and processing continues, but the KSC carries a facetable large_gap marker and the
# job emits an operator-visible message. 730 days ~= 2 years.
DISP_S1_LARGE_GAP_THRESHOLD_DAYS: 730

# Master switch for the processing-mode annotations carried by a DISP-S1 consistent burst database
# whose sensing_time_list maps each sensing time to a historical_NN / forward_NN / no_run label.
# When false, an annotated database is parsed exactly like an un-annotated one -- the labels are
# dropped, frames carry no phases, and every phase-aware code path (historical processing phase walk,
# phase-bounded compressed CSLC lineage, k-cycle evaluator phase guards) stays dormant. Enable this
# only on venues running phased historical campaigns.
DISP_S1_PROCESSING_MODE_ENABLED: false

# Honour the consistent burst database's exclusions in DISP-S1 forward processing. An acquisition the
# database does not list, on a date inside the range its CMR survey assessed, was left out
# deliberately -- typically a pass covering only part of the frame -- so it must not occupy a k-slot
# or count as an unresolved gap in the lineage. Dates past the surveyed range are unaffected: the
# survey never looked at them, so they stay ordinary forward work. This applies to ALL DISP-S1
# forward processing, not only phased campaigns. Set false ONLY to roll back to the previous
# behavior, in which such an acquisition silently blocks every later forward date of its frame.
DISP_S1_BURST_DB_EXCLUSION_ENABLED: true

# This file contains mapping of frame_id to burst_id and all its sensing times based on real CMR data.
# This is the processing-mode-annotated variant: it carries the same frames, bursts and sensing times
# as the un-annotated file of the same vintage, and additionally labels each sensing time. With
# DISP_S1_PROCESSING_MODE_ENABLED off the labels are dropped at load, so pointing here changes no
# behavior on a venue that has not enabled phased processing.
DISP_S1_BURST_DB_S3PATH: "s3://opera-ancillaries/disp_frames/disp_s1_consistent_burst_db/opera-disp-s1-consistent-burst-ids-with-processing-mode-2026-08-10-2016-07-01_to_2026-04-30.json"

# This file contains list of blackout date ranges for DISP-S1 processing on a per-frame basis
DISP_S1_BLACKOUT_DATES_S3PATH: "s3://opera-ancillaries/disp_frames/disp_s1_blackout_dates/opera-disp-s1-blackout-dates-2025-09-16.json"

# This file contains geo boundaries of all DISP-S1 frames
DISP_S1_FRAME_GEO_SIMPLE: "s3://opera-ancillaries/disp_frames/disp_s1_frame_geo_simple/frame-geometries-simple-0.10.0.geojson"

# JSON db mapping regions to lists of frame IDs
DISP_S1_FRAME_REGION_DB:
  # URL of frame db
  URL: "s3://opera-ancillaries/disp_frames/region_db/opera-disp-s1-region-db_2026-08-19.json"

  # Raise an error if db cannot be localized/parsed
  REQUIRE_DB: true

  # Raise an error if frame not mapped in db, otherwise use region=UNKNOWN
  ERR_IF_DB_INCOMPLETE: false

# Whitelist for DISP-S1 regions to process. If null or empty, process all regions
DISP_S1_REGION_WHITELIST:

# Location of the burst lookup table for DIST-S1 processing
#DIST_S1_BURST_DB_S3PATH: "s3://opera-ancillaries/dist_s1/mgrs_burst_lookup_table-2025-02-19.parquet"
DIST_S1_BURST_DB_S3PATH: "s3://opera-ancillaries/dist_s1/mgrs_burst_lookup_table_2025-11-19.parquet"

# The minimum coverage, defined as the percent of frames in a mgrs set, required to run DSWx_NI
#  Must be an integer in the closed interval [0, 100] or null (~).
#  Cannot be set together with DSWX_NI_MINIMUM_NUMBER_OF_BURSTS_REQUIRED.
DSWX_NI_COVERAGE_TARGET: ~
# The minimum coverage, defined as the number of frames in a mgrs set, required to run DSWx_NI
#  Must be a non-negative integer or null (~).
#  Cannot be set together with DSWX_NI_COVERAGE_TARGET.
DSWX_NI_MINIMUM_NUMBER_OF_FRAMES_REQUIRED: 1
# Force DSWx-NI processing of pending burst sets after X minutes, rather than waiting for additional data
DSWX_NI_COLLECTION_GRACE_PERIOD_MINUTES: 210
# Location of the DSWx-NI mgrs tile collection database
DSWX_NI_MGRS_TILE_COLLECTION_DB_S3PATH: "s3://opera-ancillaries/dswx_ni/DSWx-NI_MGRS_collection_DB_0.5.sqlite"

DIST_S1_TRIGGERING:
  DEFAULT_DIST_S1_QUERY_GRACE_PERIOD_MINUTES: 210 # Force DIST-S1 processing of pending burst sets after X minutes, rather than waiting for additional data
  MIN_CMR_RTC_CACHE_DOCUMENT_COUNT: 30000 #1000 RTC granules per day * 30 days
  WARN_CMR_RTC_CACHE_DOCUMENT_COUNT: 150000 #5000 RTC granules per day * 30 days
  MIN_CMR_RTC_CACHE_DOCUMENT_DATE_RANGE_DAYS: 20
  WARN_CMR_RTC_CACHE_DOCUMENT_DATE_RANGE_DAYS: 28
  DEFAULT_DIST_S1_WINDOW_DELTA_DAYS: 60

