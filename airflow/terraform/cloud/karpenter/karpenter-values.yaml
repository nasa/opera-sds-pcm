# Karpenter Helm Chart Values
replicas: ${controller_replicas}

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

priorityClassName: system-cluster-critical

podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: karpenter

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: karpenter

controller:
  resources:
    requests:
      cpu: "${controller_cpu_request}"
      memory: "${controller_memory_request}"
    limits:
      cpu: "${controller_cpu_limit}"
      memory: "${controller_memory_limit}"

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault

logLevel: info

settings:
  batchMaxDuration: "${batch_max_duration}"
  batchIdleDuration: "${batch_idle_duration}"
  
  clusterName: "${cluster_name}"
  clusterEndpoint: "${cluster_endpoint}"
  
  interruptionQueue: "${interruption_queue}"
  
  featureGates:
    spotToSpotConsolidation: false

serviceAccount:
  create: true
  annotations: {} 